<link rel="manifest" id="manifestLink">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap');

  :root{
    --wine: #3a0f1c;
    --wine-2: #4d1526;
    --blush: #f2c9c2;
    --rose: #c4536b;
    --rose-deep: #9c3355;
    --gold: #d9a86c;
    --green: #8fae8b;
    --ink: #fbeee9;
    --ink-dim: #d9b8bd;
    --line: rgba(217,168,108,0.28);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 15% -5%, rgba(196,83,107,0.28), transparent 55%),
      radial-gradient(ellipse at 90% 5%, rgba(217,168,108,0.16), transparent 50%),
      linear-gradient(180deg, var(--wine) 0%, var(--wine-2) 100%);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
  }

  .petals{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(2px 2px at 12% 22%, rgba(242,201,194,0.55), transparent),
      radial-gradient(2px 2px at 82% 12%, rgba(217,168,108,0.5), transparent),
      radial-gradient(1.5px 1.5px at 60% 75%, rgba(242,201,194,0.4), transparent),
      radial-gradient(2px 2px at 30% 88%, rgba(217,168,108,0.45), transparent),
      radial-gradient(1.5px 1.5px at 92% 65%, rgba(242,201,194,0.4), transparent),
      radial-gradient(2px 2px at 45% 42%, rgba(217,168,108,0.4), transparent);
    opacity: 0.6;
  }

  .app{ position:relative; z-index:1; width:100%; max-width: 480px; }

  header.top{
    text-align:center;
    margin-bottom: 22px;
  }
  header.top .eyebrow{
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  header.top h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 40px;
    margin: 0;
    line-height: 1.05;
    color: var(--blush);
  }
  header.top .sub{
    color: var(--ink-dim);
    font-size: 13.5px;
    margin-top: 8px;
  }

  .card{
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    backdrop-filter: blur(6px);
  }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  input[type=text]{
    width:100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    font-size: 15px;
    outline:none;
  }
  input[type=text]:focus{ border-color: var(--gold); }
  input[type=text]::placeholder{ color: rgba(251,238,233,0.4); }
  input[type=file]{ display:none; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    gap: 8px;
    background: linear-gradient(180deg, var(--rose), var(--rose-deep));
    color: #fff3ee;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    width: 100%;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow: 0 8px 20px rgba(156,51,85,0.35); }
  .btn:active{ transform: translateY(0); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--gold);
  }
  .btn.small{ width: auto; padding: 8px 14px; font-size: 13px; }
  .btn.green{ background: linear-gradient(180deg, #a9c6a4, var(--green)); color: #1c2b1a; }

  .btn-del{
    display:inline-flex; align-items:center; gap:5px;
    background: rgba(196,83,107,0.1);
    border: 1px solid rgba(196,83,107,0.4);

<body>
<div class="petals"></div>
<div class="app" id="app"></div>

<script>
const app = document.getElementById('app');

let state = {
  screen: 'entry', // entry | main
  roomCode: '',
  name: '',
  tab: 'mine', // mine | draw | todo | done
  drawFilter: 'any',
  revealedWish: null,
  roomData: null
};

// draft data that lives outside of render() so it survives re-renders untouched
let drafts = {
  newCategory: '',
  wishByCat: {}, // { catId: { text, image, proofRequired } }
};
let proofDrafts = {}; // { wishId: imageDataUrl }

// ---------- typing-safe rendering ----------
let typingActive = false;
let pendingRoomData = null;

document.addEventListener('focusin', (e) => {
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')){
    typingActive = true;
  }
});
document.addEventListener('focusout', (e) => {
  typingActive = false;
  if(pendingRoomData){
    state.roomData = pendingRoomData;
    pendingRoomData = null;
    render();
  }
});

// ---------- lokale Datenbank (IndexedDB) ----------
// Jede Rauminfo wird zusätzlich lokal auf dem Gerät gespeichert (echte Browser-Datenbank,
// kein flüchtiger Zwischenspeicher). Das macht die App offline nutzbar und sorgt für
// einen sofortigen Start, während im Hintergrund mit dem Partner-Gerät abgeglichen wird.
const DB_NAME = 'herzensangelegenheit-db';
const DB_STORE = 'rooms';
let dbPromise = null;

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        db.createObjectStore(DB_STORE, { keyPath: 'code' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function dbSaveLocal(code, data){
  try{
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put({ code: code.toUpperCase(), data, updatedAt: Date.now() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ return false; }
}

async function dbLoadLocal(code){
  try{
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(code.toUpperCase());
      req.onsuccess = () => resolve(req.result ? req.result.data : null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}

// ---------- storage helpers ----------
// Online-Abgleich läuft über den geteilten Cloud-Speicher (window.storage), damit beide
// Partner denselben Stand sehen. Jede erfolgreiche Lese-/Schreiboperation wird zusätzlich
// in die lokale IndexedDB gespiegelt. Ist kein Internet verfügbar, greift die App auf den
// zuletzt gespeicherten lokalen Stand zurück, statt einfach leer zu bleiben.
let isOffline = false;

function roomKey(code){ return 'herzensangelegenheit-room-' + code.toUpperCase(); }

async function loadRoom(code){
  try{
    const res = await window.storage.get(roomKey(code), true);
    const data = res ? JSON.parse(res.value) : null;
    isOffline = false;
    if(data) await dbSaveLocal(code, data);
    return data;
  }catch(e){
    isOffline = true;
    const local = await dbLoadLocal(code);
    return local;
  }
}

async function saveRoom(code, data){
  await dbSaveLocal(code, data);
  try{
    await window.storage.set(roomKey(code), JSON.stringify(data), true);
    isOffline = false;
  }catch(e){
    isOffline = true;
    console.error('Online-Speichern fehlgeschlagen, lokal gesichert', e);
  }
}

function emptyRoom(){
  return { players: [], profiles: {}, categories: [], wishes: [] };
}

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function uid(){ return Math.random().toString(36).slice(2,10); }

// wish.status: 'available' | 'in_progress' | 'completed'
// wish.image: optional dataURL reference picture
// wish.proofRequired: bool - creator wants a proof photo before it counts as done
// wish.drawnBy / wish.drawerDone / wish.proofImage / wish.completedAt

// ---------- image helper ----------
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- rendering ----------
function render(){
  if(state.screen === 'entry') renderEntry();
  else renderMain();
}

function renderEntry(){
  const params = new URLSearchParams(window.location.search);
  if(!state.roomCode && params.get('raum')){
    state.roomCode = params.get('raum').toUpperCase();
  }

  app.innerHTML = `
    <header class="top">
      <div class="eyebrow">Für zwei Herzen</div>
      <h1>Herzensangelegenheit</h1>
      <div class="sub">Legt Wünsche in Kategorien ab und zieht überraschend<br>einen Herzenswunsch des anderen.</div>
    </header>
    <div class="card">
      <div class="field">
        <label>Dein Name</label>
        <input type="text" id="nameInput" placeholder="z.B. Alex" value="${escapeAttr(state.name)}">
      </div>
      <div class="field">
        <label>Raum-Code</label>
        <input type="text" id="codeInput" placeholder="z.B. 7QX2M" maxlength="8" style="text-transform:uppercase" value="${escapeAttr(state.roomCode)}">
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="btn" id="joinBtn">Raum betreten</button>
      </div>
      <button class="btn ghost" id="createBtn" style="margin-top:10px;">Neuen Raum erstellen</button>
      <div class="hint">Erstellt eine Person einen Raum, kann sie die zweite Person direkt aus der App heraus einladen. Beide öffnen diese Seite und tragen denselben Code ein — funktioniert auf iPhone, Android und am Computer.</div>
      <div id="installHolder"></div>
    </div>
  `;

  document.getElementById('nameInput').oninput = e => state.name = e.target.value;
  document.getElementById('codeInput').oninput = e => state.roomCode = e.target.value.toUpperCase();

  document.getElementById('createBtn').onclick = async () => {
    const code = genCode();
    state.roomCode = code;
    document.getElementById('codeInput').value = code;
    await enterRoom(true);
  };
  document.getElementById('joinBtn').onclick = async () => {
    await enterRoom(false);
  };

  renderInstallButton();
}

async function enterRoom(isNew){
  if(!state.name.trim()){ alert('Bitte gib deinen Namen ein.'); return; }
  if(!state.roomCode.trim()){ alert('Bitte gib einen Raum-Code ein.'); return; }

  let data = await loadRoom(state.roomCode);
  if(!data) data = emptyRoom();
  if(!data.profiles) data.profiles = {};

  if(!data.players.includes(state.name)){
    if(data.players.length >= 2 && !isNew){
      const proceed = confirm('Dieser Raum hat bereits zwei Namen. Trotzdem mit deinem Namen beitreten?');
      if(!proceed) return;
    }
    data.players.push(state.name);
  }

  await saveRoom(state.roomCode, data);
  state.roomData = data;
  state.screen = 'main';
  render();
  startPolling();
}

function escapeAttr(s){
  return (s||'').replace(/"/g,'&quot;');
}
function escapeHtml(s){
  return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' · ' +
         d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
}
function initials(name){
  return (name||'?').trim().slice(0,1).toUpperCase();
}

// ---------- polling (skips re-render while someone is typing) ----------
let pollTimer = null;
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const fresh = await loadRoom(state.roomCode);
    if(!fresh) return;
    const changed = JSON.stringify(fresh) !== JSON.stringify(state.roomData);
    if(!changed) return;
    if(typingActive){
      pendingRoomData = fresh;
    } else {
      state.roomData = fresh;
      if(state.screen === 'main') render();
    }
  }, 3500);
}

// ---------- main screen ----------
function renderMain(){
  const data = state.roomData || emptyRoom();
  const otherPlayer = data.players.find(p => p !== state.name);

  const todoCount = data.wishes.filter(w => w.status === 'in_progress').length;
  const doneCount = data.wishes.filter(w => w.status === 'completed').length;

  const myAvatar = (data.profiles && data.profiles[state.name] && data.profiles[state.name].avatar) || null;
  const otherAvatar = otherPlayer && data.profiles && data.profiles[otherPlayer] && data.profiles[otherPlayer].avatar;

  app.innerHTML = `
    <header class="top">
      <div class="eyebrow">Raum ${escapeHtml(state.roomCode)}</div>
      <h1>Herzensangelegenheit</h1>
    </header>

    <div class="avatars">
      <div class="avatar-wrap">
        <div class="avatar" id="myAvatarBtn">
          ${myAvatar ? `<img src="${myAvatar}">` : initials(state.name)}
          <div class="avatar-plus">+</div>
        </div>
        <div class="avatar-name">${escapeHtml(state.name)} (du)</div>
      </div>
      <div class="heart-divider">♥</div>
      <div class="avatar-wrap">
        <div class="avatar static">
          ${otherPlayer ? (otherAvatar ? `<img src="${otherAvatar}">` : initials(otherPlayer)) : '?'}
        </div>
        <div class="avatar-name">${otherPlayer ? escapeHtml(otherPlayer) : 'wartet …'}</div>
      </div>
    </div>
    <input type="file" id="avatarFile" accept="image/*">

    <div class="roombar">
      <div>${isOffline ? '📴 Offline · lokal gespeichert' : (otherPlayer ? 'Verbunden mit ' + escapeHtml(otherPlayer) : 'Zweite Person fehlt noch')}</div>
      <div class="leave" id="leaveBtn">Raum verlassen</div>
    </div>

    ${!otherPlayer ? `
    <div class="invite-card">
      <div style="font-size:12.5px; color:var(--ink-dim);">Lade deinen Partner / deine Partnerin ein</div>
      <div class="code">${escapeHtml(state.roomCode)}</div>
      <button class="btn small" id="inviteBtn" style="width:auto;">💌 Einladung teilen</button>
      <div class="invite-copied" id="inviteCopied"></div>
    </div>` : ''}

    <div class="tabs">
      <div class="tab ${state.tab==='mine'?'active':''}" id="tabMine">Wünsche</div>
      <div class="tab ${state.tab==='draw'?'active':''}" id="tabDraw">Ziehen</div>
      <div class="tab ${state.tab==='todo'?'active':''}" id="tabTodo">ToDo${todoCount ? `<span class="badge">${todoCount}</span>` : ''}</div>
      <div class="tab ${state.tab==='done'?'active':''}" id="tabDone">Erledigt${doneCount ? `<span class="badge">${doneCount}</span>` : ''}</div>
    </div>

    <div id="tabContent"></div>
    <div class="sync-note">Wird alle paar Sekunden automatisch abgeglichen</div>
  `;

  document.getElementById('leaveBtn').onclick = () => {
    if(pollTimer) clearInterval(pollTimer);
    state.screen = 'entry';
    state.revealedWish = null;
    render();
  };
  document.getElementById('tabMine').onclick = () => { state.tab='mine'; render(); };
  document.getElementById('tabDraw').onclick = () => { state.tab='draw'; state.revealedWish=null; render(); };
  document.getElementById('tabTodo').onclick = () => { state.tab='todo'; render(); };
  document.getElementById('tabDone').onclick = () => { state.tab='done'; render(); };

  document.getElementById('myAvatarBtn').onclick = () => {
    document.getElementById('avatarFile').click();
  };
  document.getElementById('avatarFile').onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const dataUrl = await resizeImage(file, 200, 0.75);
    const data2 = await loadRoom(state.roomCode) || emptyRoom();
    if(!data2.profiles) data2.profiles = {};
    data2.profiles[state.name] = { avatar: dataUrl };
    await saveRoom(state.roomCode, data2);
    state.roomData = data2;
    render();
  };

  const inviteBtn = document.getElementById('inviteBtn');
  if(inviteBtn){
    inviteBtn.onclick = async () => {
      const link = window.location.origin + window.location.pathname + '?raum=' + encodeURIComponent(state.roomCode);
      const text = `Ich lade dich zu unserer "Herzensangelegenheit" ein 💌\nRaum-Code: ${state.roomCode}\nÖffne die App und trage den Code ein: ${link}`;
      let done = false;
      if(navigator.share){
        try{ await navigator.share({ title: 'Herzensangelegenheit', text }); done = true; }catch(e){ /* user cancelled or unsupported */ }
      }
      if(!done && navigator.clipboard){
        try{ await navigator.clipboard.writeText(text); done = true; }catch(e){ /* fall through */ }
      }
      if(!done){
        try{
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          done = true;
        }catch(e){ /* ignore */ }
      }
      const note = document.getElementById('inviteCopied');
      if(note) note.textContent = done ? 'In die Zwischenablage kopiert – jetzt einfach einfügen und senden.' : ('Code manuell teilen: ' + state.roomCode);
    };
  }

  if(state.tab === 'mine') renderMineTab();
  else if(state.tab === 'draw') renderDrawTab();
  else if(state.tab === 'todo') renderTodoTab();
  else renderDoneTab();
}

function renderMineTab(){
  const data = state.roomData || emptyRoom();
  const container = document.getElementById('tabContent');

  const myCats = data.categories;
  let catsHtml = '';
  if(myCats.length === 0){
    catsHtml = `<div class="empty">Noch keine Kategorien. Leg unten deine erste an — zum Beispiel „Romantische Abende" oder „Kleine Aufmerksamkeiten".</div>`;
  } else {
    catsHtml = myCats.map(cat => {
      const totalInCat = data.wishes.filter(w => w.categoryId === cat.id).length;
      const myWishes = data.wishes.filter(w => w.categoryId === cat.id && w.owner === state.name && w.status === 'available');
      const wishesHtml = myWishes.length
        ? myWishes.map(w => `
            <div class="wish-item">
              ${w.image ? `<img class="thumb" src="${w.image}">` : ''}
              <div class="body">
                <div class="txt">${escapeHtml(w.text)}</div>
                ${w.proofRequired ? `<div class="proof-tag">📸 Beweisfoto erwünscht</div>` : ''}
              </div>
              <button class="btn-del" data-del="${w.id}">🗑 Löschen</button>
            </div>`).join('')
        : `<div class="wish-item"><span class="txt" style="color:var(--ink-dim)">Noch keine offenen Wünsche in dieser Kategorie.</span></div>`;

      const deleteLink = totalInCat === 0
        ? `<button class="btn-del" data-delcat="${cat.id}">🗑 Kategorie löschen</button>`
        : '';

      const draft = drafts.wishByCat[cat.id] || { text:'', image:null, proofRequired:false };

      return `
        <div class="category">
          <h3><span class="catname">${escapeHtml(cat.name)}</span><span class="count">${myWishes.length} offen</span></h3>
          ${wishesHtml}
          <div class="add-wish-box">
            <div class="add-wish-row">
              <input type="text" placeholder="Neuen Wunsch hinzufügen …" data-catinput="${cat.id}" value="${escapeAttr(draft.text)}">
            </div>
            <div class="add-extra-row">
              <label class="btn-photo">📷 Bild
                <input type="file" accept="image/*" data-catimage="${cat.id}">
              </label>
              ${draft.image ? `<img class="preview-thumb" src="${draft.image}">` : ''}
              <label class="checkbox-line">
                <input type="checkbox" data-catproof="${cat.id}" ${draft.proofRequired ? 'checked' : ''}>
                Beweisfoto beim Erledigen erwünscht
              </label>
            </div>
            <button class="btn small submit-wish-btn" data-addwish="${cat.id}" style="width:100%;">Wunsch hinzufügen</button>
          </div>
          ${deleteLink ? `<div style="text-align:right; margin-top:12px;">${deleteLink}</div>` : ''}
        </div>`;
    }).join('');
  }

  container.innerHTML = `
    ${catsHtml}
    <div class="card">
      <div class="field" style="margin-bottom:10px;">
        <label>Neue Kategorie</label>
        <div class="row">
          <input type="text" id="newCatInput" placeholder="z.B. Verwöhn-Momente" value="${escapeAttr(drafts.newCategory)}">
          <button class="btn small" id="addCatBtn" style="width:auto;">Anlegen</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('newCatInput').oninput = e => drafts.newCategory = e.target.value;

  document.getElementById('addCatBtn').onclick = async () => {
    const val = (drafts.newCategory || '').trim();
    if(!val) return;
    const data2 = await loadRoom(state.roomCode) || emptyRoom();
    data2.categories.push({ id: uid(), name: val });
    await saveRoom(state.roomCode, data2);
    state.roomData = data2;
    drafts.newCategory = '';
    render();
  };

  container.querySelectorAll('[data-catinput]').forEach(inp => {
    inp.oninput = (e) => {
      const catId = inp.getAttribute('data-catinput');
      if(!drafts.wishByCat[catId]) drafts.wishByCat[catId] = { text:'', image:null, proofRequired:false };
      drafts.wishByCat[catId].text = e.target.value;
    };
  });

  container.querySelectorAll('[data-catimage]').forEach(inp => {
    inp.onchange = async (e) => {
      const catId = inp.getAttribute('data-catimage');
      const file = e.target.files[0];
      if(!file) return;
      const dataUrl = await resizeImage(file, 480, 0.7);
      if(!drafts.wishByCat[catId]) drafts.wishByCat[catId] = { text:'', image:null, proofRequired:false };
      drafts.wishByCat[catId].image = dataUrl;
      render();
    };
  });

  container.querySelectorAll('[data-catproof]').forEach(cb => {
    cb.onchange = (e) => {
      const catId = cb.getAttribute('data-catproof');
      if(!drafts.wishByCat[catId]) drafts.wishByCat[catId] = { text:'', image:null, proofRequired:false };
      drafts.wishByCat[catId].proofRequired = e.target.checked;
    };
  });

  container.querySelectorAll('[data-addwish]').forEach(btn => {
    btn.onclick = async () => {
      const catId = btn.getAttribute('data-addwish');
      const draft = drafts.wishByCat[catId] || { text:'', image:null, proofRequired:false };
      const val = (draft.text || '').trim();
      if(!val) return;
      const data2 = await loadRoom(state.roomCode) || emptyRoom();
      data2.wishes.push({
        id: uid(), categoryId: catId, text: val, owner: state.name,
        image: draft.image || null, proofRequired: !!draft.proofRequired,
        status: 'available', drawnBy: null, drawerDone: false, proofImage: null, completedAt: null
      });
      await saveRoom(state.roomCode, data2);
      state.roomData = data2;
      delete drafts.wishByCat[catId];
      render();
    };
  });

  container.querySelectorAll('[data-del]').forEach(el => {
    el.onclick = async () => {
      if(!confirm('Diesen Wunsch wirklich löschen?')) return;
      const wishId = el.getAttribute('data-del');
      const data2 = await loadRoom(state.roomCode) || emptyRoom();
      data2.wishes = data2.wishes.filter(w => w.id !== wishId);
      await saveRoom(state.roomCode, data2);
      state.roomData = data2;
      render();
    };
  });

  container.querySelectorAll('[data-delcat]').forEach(el => {
    el.onclick = async () => {
      const catId = el.getAttribute('data-delcat');
      const data2 = await loadRoom(state.roomCode) || emptyRoom();
      const stillHasWishes = data2.wishes.some(w => w.categoryId === catId);
      if(stillHasWishes){
        alert('Diese Kategorie enthält inzwischen Wünsche und kann nicht gelöscht werden.');
        state.roomData = data2;
        render();
        return;
      }
      if(!confirm('Diese Kategorie wirklich löschen?')) return;
      data2.categories = data2.categories.filter(c => c.id !== catId);
      await saveRoom(state.roomCode, data2);
      state.roomData = data2;
      render();
    };
  });
}

function renderDrawTab(){
  const data = state.roomData || emptyRoom();
  const container = document.getElementById('tabContent');
  const otherPlayer = data.players.find(p => p !== state.name);

  if(!otherPlayer){
    container.innerHTML = `<div class="empty">Sobald die zweite Person diesem Raum beigetreten ist, könnt ihr Wünsche voneinander ziehen.</div>`;
    return;
  }

  const partnerWishes = data.wishes.filter(w => w.owner === otherPlayer && w.status === 'available');
  const categories = data.categories.filter(c => partnerWishes.some(w => w.categoryId === c.id));

  const filterOptions = `<option value="any">Alle Kategorien</option>` +
    categories.map(c => `<option value="${c.id}" ${state.drawFilter===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');

  const pool = state.drawFilter === 'any'
    ? partnerWishes
    : partnerWishes.filter(w => w.categoryId === state.drawFilter);

  container.innerHTML = `
    <div class="filter-row">
      <select id="filterSelect">${filterOptions}</select>
    </div>
    <div class="card draw-stage">
      <div class="well" id="wellBtn">💌</div>
      <div style="color:var(--ink-dim); font-size:13.5px;">
        ${pool.length > 0
          ? `Tippe auf den Brief, um einen Wunsch von ${escapeHtml(otherPlayer)} zu ziehen.`
          : `${escapeHtml(otherPlayer)} hat gerade keine offenen Wünsche in dieser Auswahl.`}
      </div>
      <div id="revealArea"></div>
    </div>
  `;

  document.getElementById('filterSelect').onchange = (e) => {
    state.drawFilter = e.target.value;
    state.revealedWish = null;
    render();
  };

  if(state.revealedWish){
    const w = state.revealedWish;
    const cat = data.categories.find(c => c.id === w.categoryId);
    document.getElementById('revealArea').innerHTML = `
      <div class="reveal">
        ${w.image ? `<img src="${w.image}">` : ''}
        <div class="cat">${cat ? escapeHtml(cat.name) : 'Wunsch'}</div>
        <div class="txt">„${escapeHtml(w.text)}"</div>
        <div class="from">Wunsch von ${escapeHtml(otherPlayer)} · wandert jetzt in deine ToDo-Liste</div>
      </div>
    `;
  }

  const well = document.getElementById('wellBtn');
  well.onclick = async () => {
    if(pool.length === 0) return;
    well.classList.add('spin');
    setTimeout(() => well.classList.remove('spin'), 700);
    const pick = pool[Math.floor(Math.random() * pool.length)];

    const data2 = await loadRoom(state.roomCode) || emptyRoom();
    const wishRef = data2.wishes.find(w => w.id === pick.id);
    if(wishRef && wishRef.status === 'available'){
      wishRef.status = 'in_progress';
      wishRef.drawnBy = state.name;
      wishRef.drawerDone = false;
      state.revealedWish = wishRef;
      await saveRoom(state.roomCode, data2);
      state.roomData = data2;
    }
    render();
  };
}

function renderTodoTab(){
  const data = state.roomData || emptyRoom();
  const container = document.getElementById('tabContent');
  const items = data.wishes.filter(w => w.status === 'in_progress');

  if(items.length === 0){
    container.innerHTML = `<div class="empty">Aktuell keine offenen Aufgaben. Zieht unter „Ziehen" einen Wunsch voneinander.</div>`;
    return;
  }

  container.innerHTML = items.map(w => {
    const cat = data.categories.find(c => c.id === w.categoryId);
    const isDrawer = w.drawnBy === state.name;
    const isOwner = w.owner === state.name;
    const proofPending = proofDrafts[w.id];

    let statusLine = '';
    let actionHtml = '';

    if(!w.drawerDone){
      if(isDrawer){
        statusLine = `Du hast diesen Wunsch von ${escapeHtml(w.owner)} gezogen.`;
        if(w.proofRequired){
          actionHtml = `
            <label class="btn-photo" style="margin-bottom:8px; display:inline-flex;">📸 Beweisfoto aufnehmen
              <input type="file" accept="image/*" capture="environment" data-proofinput="${w.id}">
            </label>
            ${proofPending ? `<div style="margin:8px 0;"><img class="preview-thumb" src="${proofPending}" style="width:56px;height:56px;"></div>` : ''}
            <button class="btn green small" data-drawerdone="${w.id}" ${proofPending ? '' : 'disabled'}>Ich habe es erledigt</button>
          `;
        } else {
          actionHtml = `<button class="btn green small" data-drawerdone="${w.id}">Ich habe es erledigt</button>`;
        }
      } else {
        statusLine = `${escapeHtml(w.drawnBy)} kümmert sich gerade darum.`;
      }
    } else {
      if(isOwner){
        statusLine = `${escapeHtml(w.drawnBy)} sagt: erledigt! Bestätige, wenn es stimmt.`;
        actionHtml = `<button class="btn green small" data-confirm="${w.id}">Als abgeschlossen markieren</button>`;
      } else {
        statusLine = `Warte auf Bestätigung von ${escapeHtml(w.owner)}.`;
      }
    }

    return `
      <div class="todo-item">
        ${w.image ? `<img src="${w.image}">` : ''}
        <div class="cat">${cat ? escapeHtml(cat.name) : 'Wunsch'}</div>
        <div class="txt">„${escapeHtml(w.text)}"</div>
        <div class="meta">Gewünscht von ${escapeHtml(w.owner)}</div>
        <div class="status-line">${statusLine}</div>
        ${actionHtml}
      </div>
    `;
  }).join('');

  container.querySelectorAll('[data-proofinput]').forEach(inp => {
    inp.onchange = async (e) => {
      const wishId = inp.getAttribute('data-proofinput');
      const file = e.target.files[0];
      if(!file) return;
      const dataUrl = await resizeImage(file, 480, 0.7);
      proofDrafts[wishId] = dataUrl;
      render();
    };
  });

  container.querySelectorAll('[data-drawerdone]').forEach(btn => {
    btn.onclick = async () => {
      const wishId = btn.getAttribute('data-drawerdone');
      const data2 = await loadRoom(state.roomCode) || emptyRoom();
      const w = data2.wishes.find(w => w.id === wishId);
      if(w){
        w.drawerDone = true;
        if(proofDrafts[wishId]) w.proofImage = proofDrafts[wishId];
      }
      await saveRoom(state.roomCode, data2);
      state.roomData = data2;
      delete proofDrafts[wishId];
      render();
    };
  });

  container.querySelectorAll('[data-confirm]').forEach(btn => {
    btn.onclick = async () => {
      const wishId = btn.getAttribute('data-confirm');
      const data2 = await loadRoom(state.roomCode) || emptyRoom();
      const w = data2.wishes.find(w => w.id === wishId);
      if(w){
        w.status = 'completed';
        w.completedAt = new Date().toISOString();
      }
      await saveRoom(state.roomCode, data2);
      state.roomData = data2;
      render();
    };
  });
}

function renderDoneTab(){
  const data = state.roomData || emptyRoom();
  const container = document.getElementById('tabContent');
  const items = data.wishes
    .filter(w => w.status === 'completed')
    .sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt));

  if(items.length === 0){
    container.innerHTML = `<div class="empty">Hier sammeln sich eure eingelösten Herzenswünsche.</div>`;
    return;
  }

  container.innerHTML = items.map(w => {
    const cat = data.categories.find(c => c.id === w.categoryId);
    return `
      <div class="done-item">
        <div class="cat">${cat ? escapeHtml(cat.name) : 'Wunsch'}</div>
        <div class="txt">„${escapeHtml(w.text)}"</div>
        <div class="meta">${escapeHtml(w.owner)} wünschte sich das · erfüllt von ${escapeHtml(w.drawnBy)}</div>
        ${(w.image || w.proofImage) ? `
          <div class="proof-row">
            ${w.image ? `<div><div class="proof-label">Wunsch</div><img src="${w.image}"></div>` : ''}
            ${w.proofImage ? `<div><div class="proof-label">Beweis</div><img src="${w.proofImage}"></div>` : ''}
          </div>` : ''}
        <div class="date" style="margin-top:8px;">${formatDate(w.completedAt)}</div>
      </div>
    `;
  }).join('');
}

// ---------- PWA: Manifest ----------
// Baut das App-Manifest zur Laufzeit (Name, Icons, Startmodus) und hängt es in den <head>,
// damit Chrome/Android und Safari/iOS die Seite als installierbare App erkennen.
const APP_MANIFEST = {
  name: 'Herzensangelegenheit',
  short_name: 'Herzensangel.',
  description: 'Wunsch-Spiel für zwei',
  start_url: window.location.pathname + window.location.search,
  scope: window.location.pathname,
  display: 'standalone',
  background_color: '#3a0f1c',
  theme_color: '#3a0f1c',
  icons: [
    { src: document.querySelector('link[rel="apple-touch-icon"]').href, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
    { src: document.querySelectorAll('link[rel="icon"]')[1].href, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
  ]
};
const manifestBlob = new Blob([JSON.stringify(APP_MANIFEST)], { type: 'application/manifest+json' });
document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);

// ---------- PWA: Service Worker (Offline-Cache für die App-Hülle) ----------
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE = 'herzensangelegenheit-v1';
    self.addEventListener('install', (e) => {
      self.skipWaiting();
    });
    self.addEventListener('activate', (e) => {
      self.clients.claim();
    });
    self.addEventListener('fetch', (e) => {
      if(e.request.method !== 'GET') return;
      e.respondWith(
        caches.open(CACHE).then(async (cache) => {
          const cached = await cache.match(e.request);
          const network = fetch(e.request).then((res) => {
            if(res && res.status === 200) cache.put(e.request, res.clone());
            return res;
          }).catch(() => cached);
          return cached || network;
        })
      );
    });
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => { /* Offline-Cache optional, kein Problem falls nicht verfügbar */ });
}

// ---------- PWA: "App installieren"-Button ----------
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'block';
});

function renderInstallButton(){
  const holder = document.getElementById('installHolder');
  if(!holder) return;
  const alreadyInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(alreadyInstalled){ holder.innerHTML = ''; return; }
  holder.innerHTML = `<button class="btn ghost" id="installBtn" style="display:none; margin-top:10px;">📲 Als App installieren</button>`;
  const btn = document.getElementById('installBtn');
  if(deferredInstallPrompt) btn.style.display = 'block';
  btn.onclick = async () => {
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      btn.style.display = 'none';
    } else {
      alert('Tippe im Browser-Menü auf „Zum Startbildschirm hinzufügen" bzw. „App installieren", um Herzensangelegenheit wie eine echte App zu nutzen.');
    }
  };
}

render();
</script>
